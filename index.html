<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">بيستاش دي ألب | Pistache D'Alep</title>
  <link id="dynamicFontLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style id="themeStyles">
    :root {
      --primary: #11261d;
      --accent: #d4af37;
      --menu-bg-color: #11261d;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-text: #0f172a;
      --cat-bg: rgba(255, 255, 255, 0.9);
      --cat-text: #0f172a;
      --cat-active-bg: #11261d;
      --cat-active-text: #ffffff;
      --radius: 18px;
      --font-family: 'Tajawal', sans-serif;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: var(--menu-bg-color); 
      color: #0f172a; 
      direction: rtl; 
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--primary);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 12px;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-container { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .header-container::-webkit-scrollbar { display: none; }
    
    .logo-area h1 { font-size: 17px; font-weight: 900; color: var(--accent); cursor: pointer; }
    .search-bar { flex: 0 0 160px; }
    .search-bar input { width: 100%; padding: 7px 12px; border-radius: 20px; border: 1.5px solid rgba(255, 255, 255, 0.4); background: transparent; color: #fff; font-size: 12px; outline: none; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    
    .whatsapp-header-btn {
      background: transparent; border: 1.5px solid #25d366; color: #25d366; padding: 6px 10px; border-radius: 14px; font-size: 11.5px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; text-decoration: none;
    }

    .main-layout { max-width: 1100px; margin: 0 auto; height: calc(100vh - 70px); display: flex; flex-direction: column; padding: 0 14px; }
    
    .categories-bar { display: flex; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--cat-bg); padding: 8px 18px; border-radius: 30px; border: 1.5px solid rgba(255, 255, 255, 0.7); font-size: 13px; font-weight: 800; cursor: pointer; color: var(--cat-text); margin-left: 6px; white-space: nowrap; }
    .cat-btn.active { background: var(--primary); color: #ffffff; border-color: var(--accent); }

    .products-scroll-area { flex: 1; overflow-y: auto; padding-bottom: 100px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }

    .product-card {
      background: var(--card-bg); color: var(--card-text); border-radius: var(--radius); border: 1.5px solid rgba(255, 255, 255, 0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .product-img-wrapper { height: 240px; position: relative; }
    .product-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .product-title { font-size: 14px; font-weight: 800; color: var(--card-text); }
    .price-tag { font-size: 15px; font-weight: 900; color: var(--primary); }

    .btn-add-cart-card { width: 100%; padding: 8px; background: var(--primary); color: #fff; border: 1.5px solid var(--accent); border-radius: 9px; font-weight: 800; cursor: pointer; margin-top: 6px; }

    .floating-cart-btn {
      position: fixed; bottom: 20px; left: 20px; width: 65px; height: 65px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; cursor: pointer; border: 2px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--accent); color: #111; padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 900; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); z-index: 1000; display: none; justify-content: flex-end; backdrop-filter: blur(6px); }
    .modal-drawer { background: #fff; width: 100%; max-width: 420px; height: 100%; display: flex; flex-direction: column; }
    .drawer-header { padding: 18px; background: var(--primary); color: #fff; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); }
    .drawer-body { padding: 18px; flex: 1; overflow-y: auto; }
    .drawer-footer { padding: 18px; border-top: 1.5px solid #e2e8f0; background: #f8fafc; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-weight: 700; outline: none; }
    .btn-submit { width: 100%; padding: 14px; background: #10b981; color: #fff; font-weight: 900; border: none; border-radius: 12px; cursor: pointer; }

    .social-links-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .social-btn { display: flex; align-items: center; gap: 10px; padding: 10px 15px; border-radius: 10px; color: #fff; text-decoration: none; font-weight: 800; font-size: 13px; }
    .btn-facebook { background: #1877f2; }
    .btn-instagram { background: #e4405f; }
    .btn-telegram { background: #0088cc; }
    .btn-tiktok { background: #000000; }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-area"><h1 id="storeTitleLogo" onclick="window.location.reload()">بيستاش دي ألب</h1></div>
      <div class="search-bar"><input type="text" id="searchInput" placeholder="ابحث..." oninput="filterProducts()"></div>
      <div class="header-actions">
        <button class="whatsapp-header-btn" onclick="openSocialModal()">💬 تواصل معنا</button>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <div class="categories-bar" id="categoriesBar"></div>
    <div class="products-scroll-area">
      <div class="products-grid" id="productsGrid"><div style="color:#fff; text-align:center; padding:40px; font-weight:800;">جاري تحميل المنتجات...</div></div>
    </div>
  </div>

  <div class="floating-cart-btn" onclick="openCartDrawer()">
    🛒<span class="cart-badge" id="cartCount">0</span>
    <div style="font-size: 9px; font-weight:900;" id="cartTotal">0</div>
  </div>

  <div class="modal-overlay" id="socialModal">
    <div class="modal-drawer" style="height: auto; border-radius: 20px; margin: auto; padding: 20px; max-width: 350px;">
      <h3 style="text-align: center; color: var(--primary);">💬 تواصل معنا</h3>
      <div class="social-links-grid" id="socialContainer"></div>
      <button onclick="closeSocialModal()" style="margin-top: 15px; padding: 10px; border-radius: 10px; border: none; background: #e2e8f0; width: 100%; font-weight: 800; cursor: pointer;">إغلاق</button>
    </div>
  </div>

  <div class="modal-overlay" id="cartModal">
    <div class="modal-drawer">
      <div class="drawer-header"><h3>🛒 سلة التسوق</h3><button onclick="closeCartDrawer()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button></div>
      <div class="drawer-body" id="cartItemsContainer"></div>
      <div class="drawer-footer">
        <div style="display:flex; justify-content:space-between; margin-bottom: 12px;"><span>الإجمالي:</span><strong id="grandTotalText">0</strong></div>
        <button class="btn-submit" onclick="openCheckoutDrawer()">إتمام الطلب ➔</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-drawer">
      <div class="drawer-header"><h3>📝 بيانات الطلب</h3><button onclick="closeCheckoutDrawer()" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button></div>
      <div class="drawer-body">
        <div class="form-group"><label>الاسم بالكامل *</label><input type="text" id="custName" placeholder="أدخل اسمك"></div>
        <div class="form-group"><label>رقم الهاتف *</label><input type="tel" id="custPhone" placeholder="رقم الهاتف"></div>
        <div class="form-group">
          <label>طريقة الاستلام *</label>
          <select id="orderTypeSelect" onchange="toggleOrderType()">
            <option value="delivery">🛵 توصيل للمنزل</option>
            <option value="pickup">🏪 استلام من الفرع</option>
          </select>
        </div>
        <div id="branchGroup" class="form-group" style="display:none;"><label>اختر الفرع *</label><select id="pickupBranchSelect"></select></div>
        <div id="deliveryGroup">
          <div class="form-group"><label>المنطقة *</label><select id="custZone" onchange="updateDeliveryFee()"></select></div>
          <div class="form-group"><label>العنوان بالتفصيل *</label><textarea id="custAddress" rows="2" placeholder="الشارع، رقم العمارة، الشقة"></textarea></div>
        </div>
      </div>
      <div class="drawer-footer">
        <button class="btn-submit" onclick="submitOrder()">📲 إرسال الطلب عبر الواتساب</button>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [], cart = [], storeSettings = {}, selectedCat = "الكل", currentFee = 0;

    async function loadStoreJSON() {
      try {
        const res = await fetch('products.json');
        const data = await res.json();
        
        if(Array.isArray(data)) {
          allProducts = data;
        } else {
          allProducts = data.products || [];
          storeSettings = data.settings || {};
        }

        applySettings();
        renderCategories();
        renderProducts();
      } catch(e) {
        document.getElementById("productsGrid").innerHTML = "<p style='color:#fff; text-align:center; padding:40px; font-weight:800;'>تأكد من وجود ملف products.json في مجلد المشروع.</p>";
      }
    }

    function applySettings() {
      if(storeSettings.storeName) {
        document.getElementById("storeTitleLogo").innerText = " " + storeSettings.storeName;
        document.getElementById("pageTitle").innerText = storeSettings.storeName;
      }
      if(storeSettings.theme) {
        const root = document.documentElement;
        if(storeSettings.theme.primaryColor) root.style.setProperty('--primary', storeSettings.theme.primaryColor);
        if(storeSettings.theme.accentColor) root.style.setProperty('--accent', storeSettings.theme.accentColor);
        if(storeSettings.theme.bgColor) root.style.setProperty('--menu-bg-color', storeSettings.theme.bgColor);
        if(storeSettings.theme.cardBgColor) root.style.setProperty('--card-bg', storeSettings.theme.cardBgColor);
        if(storeSettings.theme.cardTextColor) root.style.setProperty('--card-text', storeSettings.theme.cardTextColor);
      }
      
      const zoneSel = document.getElementById("custZone");
      if(storeSettings.deliveryZones) {
        zoneSel.innerHTML = `<option value="">اختر المنطقة...</option>` + storeSettings.deliveryZones.map(z => `<option value="${z.name}" data-fee="${z.fee}">${z.name} (${z.fee} ${storeSettings.currencySymbol || 'ج'})</option>`).join("");
      }
      const branchSel = document.getElementById("pickupBranchSelect");
      if(storeSettings.branches) {
        branchSel.innerHTML = storeSettings.branches.map(b => `<option value="${b}">${b}</option>`).join("");
      }
    }

    function renderCategories() {
      let cats = ["الكل"];
      if(storeSettings.categoriesList && storeSettings.categoriesList.length) {
        storeSettings.categoriesList.forEach(c => { if(c && c.name) cats.push(c.name); });
      } else {
        allProducts.forEach(p => { if(p.category && !cats.includes(p.category)) cats.push(p.category); });
      }

      document.getElementById("categoriesBar").innerHTML = cats.map(c => `
        <button class="cat-btn ${selectedCat === c ? 'active':''}" onclick="selectCategory('${c}')">${c}</button>
      `).join("");
    }

    function selectCategory(c) {
      selectedCat = c;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allProducts.filter(p => {
        const matchCat = selectedCat === "الكل" || p.category === selectedCat;
        const matchSearch = p.name.toLowerCase().includes(q);
        return matchCat && matchSearch && !p.hidden;
      });

      if(!filtered.length) {
        document.getElementById("productsGrid").innerHTML = "<p style='color:#fff; text-align:center; grid-column:1/-1; padding:40px; font-weight:800;'>لا توجد منتجات مطابقة.</p>";
        return;
      }

      const curr = storeSettings.currencySymbol || 'ج';
      document.getElementById("productsGrid").innerHTML = filtered.map(p => `
        <div class="product-card">
          <div class="product-img-wrapper"><img src="${p.image || storeSettings.defaultImage || ''}" onerror="this.src=''"></div>
          <div class="product-info">
            <div class="product-title">${p.name}</div>
            <div class="price-tag">${p.price || 0} ${curr}</div>
            <button class="btn-add-cart-card" onclick="addToCart('${p.id}')">🛒 إضافة للسلة</button>
          </div>
        </div>
      `).join("");
    }

    function filterProducts() { renderProducts(); }

    function openSocialModal() {
      const s = storeSettings.socialLinks || {};
      let html = "";
      const num = storeSettings.whatsappNumber || "201011406537";
      html += `<a href="https://api.whatsapp.com/send?phone=${num}" target="_blank" class="social-btn" style="background:#25d366;"><i class="fa-brands fa-whatsapp"></i> واتساب</a>`;
      if(s.facebook) html += `<a href="${s.facebook}" target="_blank" class="social-btn btn-facebook"><i class="fa-brands fa-facebook"></i> فيسبوك</a>`;
      if(s.instagram) html += `<a href="${s.instagram}" target="_blank" class="social-btn btn-instagram"><i class="fa-brands fa-instagram"></i> إنستغرام</a>`;
      if(s.telegram) html += `<a href="${s.telegram}" target="_blank" class="social-btn btn-telegram"><i class="fa-brands fa-telegram"></i> تيليجرام</a>`;
      if(s.tiktok) html += `<a href="${s.tiktok}" target="_blank" class="social-btn btn-tiktok"><i class="fa-brands fa-tiktok"></i> تيك توك</a>`;
      
      document.getElementById("socialContainer").innerHTML = html;
      document.getElementById("socialModal").style.display = "flex";
    }

    function closeSocialModal() {
      document.getElementById("socialModal").style.display = "none";
    }

    function addToCart(id) {
      const p = allProducts.find(item => item.id === id);
      if(!p) return;
      const exist = cart.find(c => c.id === id);
      if(exist) exist.qty++;
      else cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
      updateCart();
    }

    function updateCart() {
      const curr = storeSettings.currencySymbol || 'ج';
      const count = cart.reduce((sum, i) => sum + i.qty, 0);
      const subtotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById("cartCount").innerText = count;
      document.getElementById("cartTotal").innerText = subtotal + " " + curr;
      document.getElementById("grandTotalText").innerText = (subtotal + currentFee) + " " + curr;

      const container = document.getElementById("cartItemsContainer");
      if(!cart.length) {
        container.innerHTML = "<p style='text-align:center; color:#94a3b8; padding:30px; font-weight:700;'>السلة فارغة</p>";
        return;
      }

      container.innerHTML = cart.map((i, idx) => `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding:10px 0;">
          <div><strong>${i.name}</strong><br><small style="color:#64748b;">${i.price} ${curr}</small></div>
          <div style="display:flex; gap:8px; align-items:center;">
            <button onclick="changeQty(${idx}, -1)" style="width:25px; height:25px; border-radius:50%; border:1px solid #ccc; font-weight:900;">-</button>
            <span>${i.qty}</span>
            <button onclick="changeQty(${idx}, 1)" style="width:25px; height:25px; border-radius:50%; border:1px solid #ccc; font-weight:900;">+</button>
          </div>
        </div>
      `).join("");
    }

    function changeQty(idx, delta) {
      cart[idx].qty += delta;
      if(cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCart();
    }

    function openCartDrawer() { updateCart(); document.getElementById("cartModal").style.display = "flex"; }
    function closeCartDrawer() { document.getElementById("cartModal").style.display = "none"; }
    function openCheckoutDrawer() { if(!cart.length) return alert("السلة فارغة!"); closeCartDrawer(); document.getElementById("checkoutModal").style.display = "flex"; }
    function closeCheckoutDrawer() { document.getElementById("checkoutModal").style.display = "none"; }

    function toggleOrderType() {
      const type = document.getElementById("orderTypeSelect").value;
      document.getElementById("deliveryGroup").style.display = type === 'delivery' ? 'block' : 'none';
      document.getElementById("branchGroup").style.display = type === 'pickup' ? 'block' : 'none';
      if(type === 'pickup') currentFee = 0;
      updateCart();
    }

    function updateDeliveryFee() {
      const sel = document.getElementById("custZone");
      currentFee = Number(sel.options[sel.selectedIndex]?.getAttribute("data-fee") || 0);
      updateCart();
    }

    function submitOrder() {
      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const orderType = document.getElementById("orderTypeSelect").value;
      
      if(!name || !phone) return alert("يرجى إدخال الاسم ورقم الهاتف!");

      let deliveryDetails = "";
      if(orderType === 'delivery') {
        const zone = document.getElementById("custZone").value;
        const address = document.getElementById("custAddress").value.trim();
        if(!zone || !address) return alert("يرجى اختيار المنطقة وكتابة العنوان التفصيلي!");
        deliveryDetails = `🛵 توصيل للمنزل\n📍 المنطقة: ${zone}\n🏠 العنوان: ${address}`;
      } else {
        const branch = document.getElementById("pickupBranchSelect").value;
        deliveryDetails = `🏪 استلام من الفرع\n📍 الفرع: ${branch}`;
      }

      const curr = storeSettings.currencySymbol || 'ج';
      let msg = `طلب جديد من ${storeSettings.storeName || 'المتجر'}\n\n👤 العميل: ${name}\n📞 الهاتف: ${phone}\n${deliveryDetails}\n\n🛒 الطلبات:\n`;
      cart.forEach(i => { msg += `▪️ ${i.name} × ${i.qty} = ${i.price * i.qty} ${curr}\n`; });
      
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0) + currentFee;
      if(currentFee > 0) msg += `🚚 التوصيل: ${currentFee} ${curr}\n`;
      msg += `\n💵 الإجمالي النهائي: ${total} ${curr}`;

      const num = storeSettings.whatsappNumber || "201011406537";
      window.location.href = `https://api.whatsapp.com/send?phone=${num}&text=${encodeURIComponent(msg)}`;
    }

    loadStoreJSON();
  </script>
</body>
</html>
