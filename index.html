<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فستق حلب - القائمة</title>
    <!-- استدعاء خط Almarai من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Almarai', sans-serif !important;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #2c5e3b;
            color: white;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-weight: 800;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .menu-category {
            margin-bottom: 30px;
        }
        .category-title {
            font-size: 1.4rem;
            color: #2c5e3b;
            border-bottom: 2px solid #2c5e3b;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .item-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-details h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            font-weight: 700;
        }
        .item-details p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }
        .price {
            font-weight: 700;
            color: #d9534f;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>فستق حلب</h1>
        <p>أطيب الحلويات والمكسرات الشامية</p>
    </header>

    <div class="container">
        <div class="menu-category">
            <h2 class="category-title">المكسرات والحلويات</h2>
            <div class="item-card">
                <div class="item-details">
                    <h3>فستق حلبي فاخر</h3>
                    <p>محمص طازج حسب الطلب</p>
                </div>
                <div class="price">25$</div>
            </div>
            <div class="item-card">
                <div class="item-details">
                    <h3>بقلاوة بالفستق</h3>
                    <p>سمن حيواني مع فستق حلبي أخضر</p>
                </div>
                <div class="price">30$</div>
            </div>
        </div>
    </div>

</body>
</html>
