<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">بيستاش دي ألب | Pistache D'Alep</title>
  <link id="dynamicFontLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style id="antiFlickerStyle">
    body { opacity: 0 !important; visibility: hidden !important; }
    body.theme-ready { opacity: 1 !important; visibility: visible !important; transition: opacity 0.15s ease-in; }
  </style>

  <script>
    (function() {
      try {
        const cachedTheme = localStorage.getItem('cached_store_theme');
        const cachedName = localStorage.getItem('cached_store_name');
        
        if (cachedTheme) {
          const theme = JSON.parse(cachedTheme);
          const root = document.documentElement;
          
          if(theme.primaryColor) root.style.setProperty('--primary', theme.primaryColor);
          if(theme.accentColor) root.style.setProperty('--accent', theme.accentColor);
          if(theme.bgColor) root.style.setProperty('--menu-bg-color', theme.bgColor);
          if(theme.cardBgColor) root.style.setProperty('--card-bg', theme.cardBgColor);
          if(theme.cardTextColor) root.style.setProperty('--card-text', theme.cardTextColor);
          if(theme.cartBtnColor) root.style.setProperty('--cart-btn-bg', theme.cartBtnColor);
          if(theme.floatingCartColor) root.style.setProperty('--floating-cart-bg', theme.floatingCartColor);
          if(theme.menuBgImage) root.style.setProperty('--menu-bg-image', "url('" + theme.menuBgImage + "')");
        }

        if (cachedName) {
          window.addEventListener('DOMContentLoaded', () => {
            const logo = document.getElementById("storeTitleLogo");
            const pageTitle = document.getElementById("pageTitle");
            if(logo) logo.innerText = " " + cachedName;
            if(pageTitle) pageTitle.innerText = cachedName;
          });
        }
      } catch(e) {}
    })();

    window.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('theme-ready');
    });
  </script>

  <style id="themeStyles">
    :root {
      --primary: #11261d;
      --accent: #d4af37;
      --card-bg: rgba(255, 255, 255, 0.96);
      --card-text: #0f172a;
      
      --cart-btn-bg: #11261d;
      --floating-cart-bg: #11261d;
      
      --cat-bg: rgba(255, 255, 255, 0.9);
      --cat-text: #0f172a;
      --cat-active-bg: #11261d;
      --cat-active-text: #ffffff;
      --cat-padding: 9px 20px;
      --cat-font-size: 13.5px;

      --text-main: #0f172a;
      --text-muted: #475569;
      --border: rgba(17, 38, 29, 0.15);
      --radius: 18px;
      --font-family: 'Tajawal', sans-serif;
      --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      --menu-bg-image: none;
      --menu-bg-color: #11261d;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: var(--menu-bg-color); 
      background-image: var(--menu-bg-image);
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text-main); 
      direction: rtl; 
      height: 100vh;
      overflow: hidden;
    }

    body.dark-mode {
      background-color: #0f172a !important;
      color: #f8fafc !important;
    }
    body.dark-mode .product-card, 
    body.dark-mode .modal-drawer,
    body.dark-mode .social-modal-card {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border-color: #334155 !important;
    }

    header {
      background-color: transparent !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      padding: 10px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
    }
    .header-container { 
      max-width: 1100px; margin: 0 auto; display: flex; align-items: center; 
      gap: 10px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; 
    }
    .header-container::-webkit-scrollbar { display: none; }
    
    .logo-area h1 { font-size: 17px; font-weight: 900; color: var(--accent); cursor: pointer; white-space: nowrap; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .search-bar { flex: 0 0 160px; flex-shrink: 0; }
    .search-bar input {
      width: 100%; padding: 7px 12px; border-radius: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.4); background: transparent !important;
      color: #fff; font-size: 12px; font-weight: 700; outline: none;
    }
    
    .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .control-btn { background: transparent !important; border: 1.5px solid rgba(255, 255, 255, 0.6); color: #fff; padding: 6px 10px; border-radius: 14px; font-size: 11.5px; font-weight: 900; cursor: pointer; }
    .whatsapp-header-btn { background: transparent !important; border: 1.5px solid #25d366; color: #25d366; padding: 6px 10px; border-radius: 14px; font-size: 11.5px; font-weight: 900; cursor: pointer; text-decoration: none; }

    .main-layout { max-width: 1100px; margin: 0 auto; height: calc(100vh - 70px); display: flex; flex-direction: column; padding: 0 14px; position: relative; }

    .categories-bar { display: flex; flex-direction: row; overflow-x: auto; white-space: nowrap; padding: 12px 0; margin-bottom: 10px; scrollbar-width: none; position: sticky; top: 0; z-index: 99; background-color: var(--menu-bg-color); flex-shrink: 0; }
    .cat-btn { background: var(--cat-bg); padding: var(--cat-padding); border-radius: 30px; border: 1.5px solid rgba(255, 255, 255, 0.7); font-size: var(--cat-font-size); font-weight: 800; cursor: pointer; color: var(--cat-text); }
    .cat-btn.active, .cat-btn:hover { background: var(--cat-active-bg); color: var(--cat-active-text); border-color: var(--accent); }

    .products-scroll-area { flex: 1; overflow-y: auto; padding-bottom: 100px; scrollbar-width: thin; scroll-behavior: smooth; }
    .category-section-group { margin-bottom: 20px; }
    .category-title-heading { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .section-divider { width: 100%; height: 2px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent); margin: 25px 0; }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .product-card {
      background: var(--card-bg); 
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: var(--radius); border: 1.5px solid rgba(255, 255, 255, 0.8);
      display: flex; flex-direction: column; box-shadow: var(--card-shadow);
      color: var(--card-text); position: relative; overflow: hidden; width: 100%;
      animation: fadeIn 0.35s ease-out forwards;
    }
    
    .product-img-wrapper { position: relative; width: 100%; height: 340px; overflow: hidden; cursor: pointer; }
    .product-img-slider { display: flex; width: 100%; height: 100%; transition: transform 0.3s ease; }
    .product-img-slider img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; background: #e2e8f0; }
    .img-nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.5); color: #fff;
      border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; z-index: 5;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .img-nav-prev { right: 8px; }
    .img-nav-next { left: 8px; }

    .video-badge-btn {
      position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.7); color: #fff;
      border: 1.5px solid var(--accent); padding: 5px 10px; border-radius: 20px; font-size: 11px;
      font-weight: 800; cursor: pointer; z-index: 6; display: flex; align-items: center; gap: 5px;
    }

    .img-gradient-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(to top, rgba(0,0,0,0.25), transparent); pointer-events: none; }

    .product-info { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; width: 100%; background: var(--card-bg); }
    .product-title { font-size: 13.5px; font-weight: 800; color: var(--card-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-controls { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .unit-select { padding: 4px 6px; border-radius: 7px; border: 1.5px solid #cbd5e1; font-size: 11px; background: #ffffff; font-weight: 800; color: #0f172a; outline: none; cursor: pointer; }
    .price-tag { font-size: 14.5px; font-weight: 900; color: var(--primary); white-space: nowrap; }
    .product-desc { font-size: 11px; color: var(--text-muted); line-height: 1.35; height: 30px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-weight: 600; }

    /* الأزرار داخل البطاقة متجاورة ومستقلة اللون */
    .product-card-actions { display: flex; gap: 8px; margin-top: 6px; width: 100%; }
    .btn-add-cart-card {
      flex: 2; padding: 9px 8px;
      background: var(--cart-btn-bg); /* لون زر السلة المستقل من لوحة التحكم */
      color: #ffffff; border: 1.5px solid var(--accent); border-radius: 10px;
      font-weight: 800; font-size: 11.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-share-card {
      flex: 1; padding: 9px 8px; background: transparent;
      border: 1.5px solid #cbd5e1; color: var(--text-muted); border-radius: 10px;
      font-size: 11.5px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
    }

    /* السلة العائمة בלون مستقل */
    .floating-cart-btn {
      position: fixed; bottom: 20px; left: 20px; width: 65px; height: 65px;
      background: var(--floating-cart-bg); /* لون زر السلة العائمة المستقل */
      color: #fff; border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 999; cursor: pointer;
      border: 2px solid var(--accent);
    }
    .cart-badge { position: absolute; top: -8px; right: -12px; background: var(--accent); color: #111; padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 900; border: 2px solid #fff; }
    .cart-total-text { font-size: 9px; font-weight: 900; margin-top: 3px; color: #f8fafc; }

    .image-lightbox-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.92); z-index: 4000; display: none; justify-content: center; align-items: center; padding: 15px; }
    .image-lightbox-card { position: relative; max-width: 90%; max-height: 85vh; display: flex; justify-content: center; align-items: center; }
    .image-lightbox-card img { max-width: 100%; max-height: 85vh; border-radius: 12px; object-fit: contain; }
    .close-lightbox-btn { position: absolute; top: -45px; right: 0; background: rgba(255, 255, 255, 0.2); color: #fff; border: none; font-size: 22px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; }
    .lightbox-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.2); color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .lightbox-prev { left: -60px; } .lightbox-next { right: -60px; }

    .lightbox-video-container { width: 100vw; max-width: 750px; aspect-ratio: 16/9; }
    .lightbox-video-container iframe { width: 100%; height: 100%; border-radius: 12px; border: none; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); z-index: 1000; display: none; justify-content: flex-end; }
    .modal-drawer { background: #fff; width: 100%; max-width: 420px; height: 100%; display: flex; flex-direction: column; }
    .drawer-header { padding: 18px; background: var(--primary); color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .drawer-body { padding: 18px; flex: 1; overflow-y: auto; }
    .drawer-footer { padding: 18px; border-top: 1.5px solid #e2e8f0; background: #f8fafc; }
    .cart-item { display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #e2e8f0; padding: 12px 0; }
    .qty-btn { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #cbd5e1; background: #f1f5f9; cursor: pointer; font-weight: 900; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12.5px; font-weight: 900; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 11px 13px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 13.5px; outline: none; }
    .btn-submit { width: 100%; padding: 14px; background: #10b981; color: #fff; font-weight: 900; border: none; border-radius: 12px; cursor: pointer; font-size: 15px; }

    .social-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 16px; }
    .social-modal-card { background: #fff; border-radius: 20px; padding: 24px; max-width: 380px; width: 100%; text-align: center; border: 2px solid var(--accent); }
    .social-links-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .social-btn { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 14px; font-weight: 900; color: #fff; text-decoration: none; font-size: 14px; }
    .btn-whatsapp { background: #25d366; } .btn-facebook { background: #1877f2; } .btn-instagram { background: #d6249f; } .btn-telegram { background: #229ed9; } .btn-tiktok { background: #000000; }

    .announcement-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.75); z-index: 3000; display: none; justify-content: center; align-items: center; padding: 20px; }
    .announcement-card { background: #fff; border-radius: 20px; padding: 25px; max-width: 400px; width: 100%; text-align: center; border: 2.5px solid var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-area"><h1 id="storeTitleLogo" onclick="window.location.reload()">بيستاش دي ألب</h1></div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="ابحث عن حلوياتك..." oninput="window.filterProducts()">
      </div>
      <div class="header-actions">
        <button class="control-btn" onclick="window.toggleDarkMode()" id="darkModeBtn">🌙 الداكن</button>
        <button class="control-btn" onclick="window.toggleLanguage()" id="langSwitchBtn">English 🌐</button>
        <button class="whatsapp-header-btn" id="contactBtn" onclick="window.openSocialModal()">💬 تواصل معنا</button>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <div class="categories-bar" id="categoriesBar">
      <button class="cat-btn active" data-cat="الكل" onclick="window.selectCategory('الكل')">الكل</button>
    </div>
    
    <div class="products-scroll-area" id="productsScrollArea">
      <div class="products-grid" id="productsGrid">
        <div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #ffffff; font-weight: 800;">جاري تحميل المنتجات...</div>
      </div>
    </div>
  </div>

  <div class="floating-cart-btn" onclick="window.openCartDrawer()">
    <div class="cart-icon-container">
      🛒
      <span class="cart-badge" id="cartCount">0</span>
    </div>
    <div class="cart-total-text" id="cartTotal">0</div>
  </div>

  <div class="image-lightbox-overlay" id="imageLightbox" onclick="window.closeLightbox()">
    <div class="image-lightbox-card" onclick="event.stopPropagation()">
      <button class="close-lightbox-btn" onclick="window.closeLightbox()">✕</button>
      <div id="lightboxContentContainer" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;">
        <img id="lightboxImg" src="" alt="صورة المنتج المكبرة">
      </div>
    </div>
  </div>

  <div class="announcement-overlay" id="announcementModal">
    <div class="announcement-card" id="announcementCardContent">
      <div id="announcementText" style="font-size: 15px; font-weight: 800; line-height: 1.6; margin-bottom: 20px; white-space: pre-line;"></div>
      <button id="announcementCloseBtn" onclick="window.closeAnnouncement()" class="btn-submit" style="background: var(--primary);">حسناً</button>
    </div>
  </div>

  <div class="social-modal-overlay" id="socialModal">
    <div class="social-modal-card">
      <h3 id="socialModalTitle" style="font-weight: 900; color: var(--primary); font-size: 20px; margin-bottom: 5px;">📞 تواصل معنا</h3>
      <p id="socialModalSub" style="color: #64748b; font-size: 12.5px;">يسعدنا تواصلك معنا عبر وسائل الاتصال التالية:</p>
      <div class="social-links-grid" id="socialLinksContainer"></div>
      <button id="socialCloseBtn" onclick="window.closeSocialModal()" style="margin-top: 20px; background: #e2e8f0; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 900; cursor: pointer; width: 100%; color: #334155;">إغلاق</button>
    </div>
  </div>

  <div class="modal-overlay" id="cartModal">
    <div class="modal-drawer">
      <div class="drawer-header">
        <h3 id="cartModalTitle" style="font-weight: 900;">🛒 سلة التسوق</h3>
        <button onclick="window.closeCartDrawer()" style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">✕</button>
      </div>
      <div class="drawer-body" id="cartItemsContainer"></div>
      <div class="drawer-footer">
        <div style="display:flex; justify-content:space-between; margin-bottom: 8px; font-size: 13.5px;"><span id="subtotalLabel">المجموع الفرعي:</span><strong id="subtotalText">0</strong></div>
        <div style="display:flex; justify-content:space-between; margin-bottom: 8px; font-size: 13.5px;"><span id="deliveryLabel">التوصيل:</span><strong id="deliveryText">0</strong></div>
        <div style="display:flex; justify-content:space-between; margin-bottom: 16px; font-size: 17px; color: var(--primary);"><span id="grandTotalLabel">الإجمالي:</span><strong id="grandTotalText">0</strong></div>
        <button class="btn-submit" id="checkoutBtn" onclick="window.openCheckoutDrawer()">إتمام الطلب ➔</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-drawer">
      <div class="drawer-header">
        <h3 id="checkoutTitle" style="font-weight: 900;">📝 بيانات الطلب</h3>
        <button onclick="window.closeCheckoutDrawer()" style="background:none; border:none; color:#fff; font-size:22px; cursor:pointer;">✕</button>
      </div>
      <div class="drawer-body">
        <div class="form-group"><label id="labelCustName">الاسم بالكامل *</label><input type="text" id="custName" placeholder="أدخل اسمك بالكامل"></div>
        <div class="form-group"><label id="labelCustPhone">رقم الهاتف *</label><input type="tel" id="custPhone" placeholder="01xxxxxxxxx"></div>
        
        <div class="form-group">
          <label id="labelOrderType">طريقة الاستلام *</label>
          <select id="orderTypeSelect" onchange="window.toggleOrderType()">
            <option value="delivery" id="optDelivery">🛵 توصيل للمنزل (ديلفري)</option>
            <option value="pickup" id="optPickup">🏪 استلام من المحل / الفرع</option>
          </select>
        </div>

        <div id="branchSelectGroup" class="form-group" style="display: none;">
          <label id="labelPickupBranch">اختر الفرع للاستلام *</label>
          <select id="pickupBranchSelect"></select>
        </div>

        <div id="deliveryFieldsGroup">
          <div class="form-group"><label id="labelCustZone">منطقة التوصيل *</label><select id="custZone" onchange="window.updateDeliveryFee()"></select></div>
          <div class="form-group"><label id="labelCustAddress">العنوان التفصيلي *</label><textarea id="custAddress" rows="2" placeholder="اسم الشارع / العمارة / رقم الشقة"></textarea></div>
        </div>

        <div class="form-group">
          <label id="labelGeneralNote">ملاحظات عامة على الطلب (اختياري)</label>
          <textarea id="orderGeneralNote" rows="2" placeholder="أي تعليمات خاصة للتوصيل أو التجهيز..."></textarea>
        </div>
      </div>
      <div class="drawer-footer">
        <button class="btn-submit" id="submitOrderBtn" onclick="window.submitOrder()">📲 إرسال الطلب عبر الواتساب</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBNy3ZPbr_cVJC2ZUzBVf8jxWdFlABYIiw",
      authDomain: "pista-7a180.firebaseapp.com",
      projectId: "pista-7a180",
      storageBucket: "pista-7a180.firebasestorage.app",
      messagingSenderId: "581989151860",
      appId: "1:581989151860:web:ffb4a82297933ac6f90d21"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [], cart = [], deliveryZones = [], storeSettings = {};
    let selectedCat = "الكل", currentFee = 0, dynamicCategories = [];
    let isScrollingProgrammatically = false;
    let currentLang = localStorage.getItem("storeLang") || "ar";
    let announcementTimer = null;

    const translationCache = JSON.parse(localStorage.getItem('pista_trans_cache') || '{}');

    async function autoTranslate(text) {
      if(!text || currentLang === 'ar') return text;
      if(translationCache[text]) return translationCache[text];

      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=en&dt=t&q=${encodeURIComponent(text)}`);
        const result = await res.json();
        const translated = result?.[0]?.[0]?.[0] || text;
        translationCache[text] = translated;
        localStorage.setItem('pista_trans_cache', JSON.stringify(translationCache));
        return translated;
      } catch(e) { return text; }
    }

    const dict = {
      ar: {
        searchPlaceholder: "ابحث عن حلوياتك...", contactBtn: "💬 تواصل معنا", allCat: "الكل",
        darkBtn: "🌙 الداكن", lightBtn: "☀️ الفاتح", socialTitle: "📞 تواصل معنا",
        socialSub: "يسعدنا تواصلك معنا عبر وسائل الاتصال التالية:", socialClose: "إغلاق",
        cartTitle: "🛒 سلة التسوق", subtotal: "المجموع الفرعي:", delivery: "التوصيل:", grandTotal: "الإجمالي:",
        checkout: "إتمام الطلب ➔", checkoutTitle: "📝 بيانات الطلب", custName: "الاسم بالكامل *",
        custNamePlaceholder: "أدخل اسمك بالكامل", custPhone: "رقم الهاتف *", orderType: "طريقة الاستلام *",
        deliveryOpt: "🛵 توصيل للمنزل (ديلفري)", pickupOpt: "🏪 استلام من المحل / الفرع", pickupBranch: "اختر الفرع للاستلام *",
        custZone: "منطقة التوصيل *", custZoneSelect: "اختر المنطقة...", custAddress: "العنوان التفصيلي *",
        custAddressPlaceholder: "اسم الشارع / العمارة / رقم الشقة", generalNote: "ملاحظات عامة على الطلب (اختياري)",
        generalNotePlaceholder: "أي تعليمات خاصة للتوصيل أو التجهيز...", submitOrder: "📲 إرسال الطلب عبر الواتساب",
        kilo: "كيلو", half: "نصف كيلو", quarter: "ربع كيلو", addToCartBtn: "🛒 إضافة", shareBtn: "مشاركة", emptyCart: "السلة فارغة", noMatch: "لا توجد منتجات مطابقة."
      },
      en: {
        searchPlaceholder: "Search items...", contactBtn: "💬 Contact Us", allCat: "All",
        darkBtn: "🌙 Dark", lightBtn: "☀️ Light", socialTitle: "📞 Contact Us",
        socialSub: "We are glad to assist you via:", socialClose: "Close",
        cartTitle: "🛒 Shopping Cart", subtotal: "Subtotal:", delivery: "Delivery:", grandTotal: "Total:",
        checkout: "Checkout ➔", checkoutTitle: "📝 Order Details", custName: "Full Name *",
        custNamePlaceholder: "Enter your full name", custPhone: "Phone Number *", orderType: "Order Type *",
        deliveryOpt: "🛵 Home Delivery", pickupOpt: "🏪 Store Pickup", pickupBranch: "Select Branch *",
        custZone: "Delivery Area *", custZoneSelect: "Select area...", custAddress: "Detailed Address *",
        custAddressPlaceholder: "Street, building, apartment no...", generalNote: "General Notes (Optional)",
        generalNotePlaceholder: "Special instructions for delivery...", submitOrder: "📲 Send Order via WhatsApp",
        kilo: "1 Kilo", half: "Half Kilo", quarter: "Quarter Kilo", addToCartBtn: "🛒 Add", shareBtn: "Share", emptyCart: "Cart is empty", noMatch: "No matching products found."
      }
    };

    window.getCurrency = () => storeSettings.currencySymbol || "ج";

    let currentLightboxImages = [], currentLightboxIndex = 0;

    window.openLightbox = (pId) => {
      const p = allProducts.find(item => item.id === pId);
      if(!p) return;
      const fallbackImg = storeSettings.defaultImage || "";
      let imgs = p.images && p.images.length > 0 ? p.images : [p.image || fallbackImg];
      currentLightboxImages = imgs.map(img => (!img || img === "undefined") ? fallbackImg : img);
      currentLightboxIndex = window.productImgIndexes && window.productImgIndexes[pId] !== undefined ? window.productImgIndexes[pId] : 0;
      renderLightboxContent();
      document.getElementById("imageLightbox").style.display = "flex";
    };

    function renderLightboxContent() {
      const container = document.getElementById("lightboxContentContainer");
      const hasMultiple = currentLightboxImages.length > 1;
      let navHtml = hasMultiple ? `
        <button class="lightbox-nav-btn lightbox-prev" onclick="event.stopPropagation(); window.slideLightbox(-1)">❮</button>
        <button class="lightbox-nav-btn lightbox-next" onclick="event.stopPropagation(); window.slideLightbox(1)">❯</button>
      ` : "";
      container.innerHTML = `<img id="lightboxImg" src="${currentLightboxImages[currentLightboxIndex]}" alt="صورة مكبرة">${navHtml}`;
    }

    window.slideLightbox = (direction) => {
      currentLightboxIndex += direction;
      if(currentLightboxIndex < 0) currentLightboxIndex = currentLightboxImages.length - 1;
      if(currentLightboxIndex >= currentLightboxImages.length) currentLightboxIndex = 0;
      document.getElementById("lightboxImg").src = currentLightboxImages[currentLightboxIndex];
    };

    window.openVideoLightbox = (videoUrl) => {
      const lightbox = document.getElementById("imageLightbox");
      const container = document.getElementById("lightboxContentContainer");
      let embedUrl = videoUrl;
      if(videoUrl.includes("youtube.com") || videoUrl.includes("youtu.be")) {
        let videoId = videoUrl.includes("youtu.be") ? videoUrl.split("/").pop() : new URLSearchParams(new URL(videoUrl).search).get("v");
        embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
      }
      container.innerHTML = `<div class="lightbox-video-container"><iframe src="${embedUrl}" allowfullscreen allow="autoplay"></iframe></div>`;
      lightbox.style.display = "flex";
    };

    window.closeLightbox = () => {
      document.getElementById("imageLightbox").style.display = "none";
      document.getElementById("lightboxContentContainer").innerHTML = '<img id="lightboxImg" src="" alt="صورة المنتج المكبرة">';
    };

    window.shareProduct = (pId, event) => {
      if (event) event.stopPropagation();
      const p = allProducts.find(item => item.id === pId);
      if (!p) return;
      const shareUrl = `${window.location.origin}${window.location.pathname}#p_${pId}`;
      const shareData = { title: p.name, text: `شاهد ${p.name} في متجرنا:`, url: shareUrl };
      if (navigator.share) { navigator.share(shareData).catch(() => {}); } 
      else { navigator.clipboard.writeText(shareUrl).then(() => alert("تم نسخ رابط المنتج بنجاح!")).catch(() => alert("الرابط: " + shareUrl)); }
    };

    window.toggleDarkMode = () => {
      const isDark = document.body.classList.toggle("dark-mode");
      localStorage.setItem("storeDarkMode", isDark ? "enabled" : "disabled");
      const btn = document.getElementById("darkModeBtn");
      if(btn) btn.innerHTML = isDark ? dict[currentLang].lightBtn : dict[currentLang].darkBtn;
    };

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem("storeDarkMode") === "enabled") {
        document.body.classList.add("dark-mode");
        const btn = document.getElementById("darkModeBtn");
        if(btn) btn.innerHTML = dict[currentLang].lightBtn;
      }
    });

    window.toggleLanguage = async () => {
      currentLang = currentLang === "ar" ? "en" : "ar";
      localStorage.setItem("storeLang", currentLang);
      document.documentElement.setAttribute("dir", currentLang === "ar" ? "rtl" : "ltr");
      document.documentElement.setAttribute("lang", currentLang);
      applyStaticTranslations();
      await renderCategories(dynamicCategories);
      await renderProducts();
      renderZonesSelect();
    };

    function applyStaticTranslations() {
      const t = dict[currentLang];
      const langBtn = document.getElementById("langSwitchBtn");
      if(langBtn) langBtn.innerHTML = currentLang === "ar" ? "English 🌐" : "العربية 🌐";
      document.getElementById("searchInput").placeholder = t.searchPlaceholder;
      document.getElementById("contactBtn").innerText = t.contactBtn;
      document.getElementById("cartModalTitle").innerText = t.cartTitle;
      document.getElementById("subtotalLabel").innerText = t.subtotal;
      document.getElementById("deliveryLabel").innerText = t.delivery;
      document.getElementById("grandTotalLabel").innerText = t.grandTotal;
      document.getElementById("checkoutBtn").innerText = t.checkout;
      document.getElementById("checkoutTitle").innerText = t.checkoutTitle;
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.documentElement.setAttribute("dir", currentLang === "ar" ? "rtl" : "ltr");
      document.documentElement.setAttribute("lang", currentLang);
      applyStaticTranslations();
    });

    function checkAndShowAnnouncement() {
      if (storeSettings.announcement && storeSettings.announcement.trim() !== "") {
        const modal = document.getElementById("announcementModal");
        document.getElementById("announcementText").innerText = storeSettings.announcement;
        modal.style.display = "flex";
      }
    }

    window.closeAnnouncement = () => document.getElementById("announcementModal").style.display = "none";
    window.openSocialModal = () => { renderSocialLinks(); document.getElementById("socialModal").style.display = "flex"; };
    window.closeSocialModal = () => document.getElementById("socialModal").style.display = "none";

    function renderSocialLinks() {
      const container = document.getElementById("socialLinksContainer");
      let html = `<a href="https://api.whatsapp.com/send?phone=${storeSettings.whatsappNumber || '201011406537'}" target="_blank" class="social-btn btn-whatsapp"><i class="fa-brands fa-whatsapp fa-lg"></i> واتساب</a>`;
      if(storeSettings.socialLinks) {
        const s = storeSettings.socialLinks;
        if(s.facebook) html += `<a href="${s.facebook}" target="_blank" class="social-btn btn-facebook"><i class="fa-brands fa-facebook fa-lg"></i> Facebook</a>`;
        if(s.instagram) html += `<a href="${s.instagram}" target="_blank" class="social-btn btn-instagram"><i class="fa-brands fa-instagram fa-lg"></i> Instagram</a>`;
        if(s.telegram) html += `<a href="${s.telegram}" target="_blank" class="social-btn btn-telegram"><i class="fa-brands fa-telegram fa-lg"></i> Telegram</a>`;
        if(s.tiktok) html += `<a href="${s.tiktok}" target="_blank" class="social-btn btn-tiktok"><i class="fa-brands fa-tiktok fa-lg"></i> TikTok</a>`;
      }
      container.innerHTML = html;
    }

    async function trackVisitor() {
      if (!sessionStorage.getItem('pista_visited')) {
        try {
          await updateDoc(doc(db, "settings", "store"), { totalVisits: increment(1), visitsSinceLastReset: increment(1) });
          sessionStorage.setItem('pista_visited', 'true');
        } catch (e) {}
      }
    }

    async function fetchStoreData() {
      try {
        const settingsSnap = await getDoc(doc(db, "settings", "store"));
        if (settingsSnap.exists()) storeSettings = settingsSnap.data();
        
        const bundleSnap = await getDoc(doc(db, "settings", "products_bundle"));
        if (bundleSnap.exists() && bundleSnap.data().productsArray) {
          allProducts = bundleSnap.data().productsArray;
        } else {
          const productsSnap = await getDocs(collection(db, "products"));
          allProducts = []; productsSnap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));
        }

        processLoadedData();
        trackVisitor();
      } catch(error) { console.error(error); }
    }

    function processLoadedData() {
      if(storeSettings.storeName) {
        document.getElementById("storeTitleLogo").innerText = " " + storeSettings.storeName;
        document.getElementById("pageTitle").innerText = storeSettings.storeName;
      }
      if(storeSettings.deliveryZones) { deliveryZones = storeSettings.deliveryZones; renderZonesSelect(); }
      renderBranchesSelect(storeSettings.branches || ["الفرع الرئيسي"]);

      if(storeSettings.theme) {
        applyDynamicTheme(storeSettings.theme);
      }

      extractCategories(storeSettings.categoriesList ? storeSettings.categoriesList.map(c => c.name) : storeSettings.categories);
      renderProducts();
      checkAndShowAnnouncement();
    }

    fetchStoreData();

    function applyDynamicTheme(theme) {
      const root = document.documentElement;
      if(theme.primaryColor) root.style.setProperty('--primary', theme.primaryColor);
      if(theme.accentColor) root.style.setProperty('--accent', theme.accentColor);
      if(theme.bgColor) root.style.setProperty('--menu-bg-color', theme.bgColor);
      if(theme.cardBgColor) root.style.setProperty('--card-bg', theme.cardBgColor);
      if(theme.cardTextColor) root.style.setProperty('--card-text', theme.cardTextColor);
      if(theme.cartBtnColor) root.style.setProperty('--cart-btn-bg', theme.cartBtnColor);
      if(theme.floatingCartColor) root.style.setProperty('--floating-cart-bg', theme.floatingCartColor);
      if(theme.menuBgImage) root.style.setProperty('--menu-bg-image', `url('${theme.menuBgImage}')`);
    }

    function extractCategories(cats = []) {
      let orderedList = [];
      if(Array.isArray(cats)) cats.forEach(c => { if(c && !orderedList.includes(c)) orderedList.push(c); });
      allProducts.forEach(p => { if(p.category && !orderedList.includes(p.category.trim())) orderedList.push(p.category.trim()); });
      dynamicCategories = orderedList;
      renderCategories(dynamicCategories);
    }

    async function renderCategories(cats) {
      const bar = document.getElementById("categoriesBar");
      let html = `<button class="cat-btn ${selectedCat === 'الكل' ? 'active':''}" data-cat="الكل" onclick="window.selectCategory('الكل')">${dict[currentLang].allCat}</button>`;
      for(let i = 0; i < cats.length; i++) {
        const c = cats[i];
        html += `<button class="cat-btn ${selectedCat === c ? 'active':''}" data-cat="${escapeHtml(c)}" onclick="window.selectCategory('${escapeHtml(c)}')">${escapeHtml(c)}</button>`;
      }
      bar.innerHTML = html;
    }

    window.selectCategory = (cat) => {
      selectedCat = cat;
      document.querySelectorAll(".cat-btn").forEach(b => {
        if(b.getAttribute("data-cat") === cat) b.classList.add("active");
        else b.classList.remove("active");
      });
      const section = document.getElementById(`cat-section-${encodeURIComponent(cat).replace(/%/g, '_')}`);
      if(section) section.scrollIntoView({ behavior: 'smooth' });
    };

    window.filterProducts = () => renderProducts();
    window.productImgIndexes = {};

    window.slideImage = (pId, direction, event) => {
      if(event) event.stopPropagation();
      const p = allProducts.find(item => item.id === pId);
      if(!p || !p.images || p.images.length <= 1) return;
      if(window.productImgIndexes[pId] === undefined) window.productImgIndexes[pId] = 0;
      window.productImgIndexes[pId] += direction;
      if(window.productImgIndexes[pId] < 0) window.productImgIndexes[pId] = p.images.length - 1;
      if(window.productImgIndexes[pId] >= p.images.length) window.productImgIndexes[pId] = 0;
      const slider = document.getElementById(`slider-${pId}`);
      if(slider) slider.style.transform = `translateX(${window.productImgIndexes[pId] * 100}%)`;
    };

    async function renderProducts() {
      const scrollArea = document.getElementById("productsScrollArea");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const curr = window.getCurrency();
      const t = dict[currentLang];

      let cats = [...dynamicCategories];
      allProducts.forEach(p => { if(p.category && !cats.includes(p.category.trim())) cats.push(p.category.trim()); });

      const fallbackImg = storeSettings.defaultImage || "";
      let finalHtml = "";

      for (let i = 0; i < cats.length; i++) {
        const catName = cats[i];
        const catProds = allProducts.filter(p => !p.hidden && p.category?.trim() === catName && (p.name.toLowerCase().includes(query) || p.description?.toLowerCase().includes(query)));

        if(catProds.length > 0) {
          finalHtml += `<div class="category-section-group" id="cat-section-${encodeURIComponent(catName).replace(/%/g, '_')}">`;
          finalHtml += `<div class="category-title-heading">${escapeHtml(catName)}</div>`;
          finalHtml += `<div class="products-grid">`;

          catProds.forEach(p => {
            let optionsHTML = '', defaultPrice = p.price || 0;
            if(p.saleType === 'weight') {
              optionsHTML = `<select class="unit-select" id="opt-${p.id}" onchange="window.updateCardPrice('${p.id}')">
                <option value="kilo" data-price="${p.pricing?.kilo || p.price}">${t.kilo}</option>
                <option value="half" data-price="${p.pricing?.half || p.price/2}">${t.half}</option>
                <option value="quarter" data-price="${p.pricing?.quarter || p.price/4}">${t.quarter}</option>
              </select>`;
              defaultPrice = p.pricing?.kilo || p.price;
            } else {
              optionsHTML = `<span style="font-size:11px; color:#64748b; font-weight:800;">${p.pricing?.unitLabel || 'علبة'}</span>`;
              defaultPrice = p.pricing?.unitPrice || p.price;
            }

            let imgs = p.images && p.images.length > 0 ? p.images : [p.image || fallbackImg];
            let sliderImgs = imgs.map(img => `<img src="${img || fallbackImg}" alt="${escapeHtml(p.name)}" onerror="this.onerror=null; this.src='${fallbackImg}';">`).join("");
            let navBtns = imgs.length > 1 ? `<button class="img-nav-btn img-nav-prev" onclick="window.slideImage('${p.id}', -1, event)">❮</button><button class="img-nav-btn img-nav-next" onclick="window.slideImage('${p.id}', 1, event)">❯</button>` : "";
            let videoBtn = p.videoUrl ? `<button class="video-badge-btn" onclick="event.stopPropagation(); window.openVideoLightbox('${p.videoUrl}')"><i class="fa-solid fa-play"></i> فيديو</button>` : "";

            finalHtml += `
              <div class="product-card">
                <div class="product-img-wrapper" onclick="window.openLightbox('${p.id}')">
                  ${videoBtn}
                  <div class="product-img-slider" id="slider-${p.id}">${sliderImgs}</div>
                  ${navBtns}
                  <div class="img-gradient-overlay"></div>
                </div>
                <div class="product-info">
                  <div class="product-title">${escapeHtml(p.name)}</div>
                  <div class="product-controls">
                    ${optionsHTML}
                    <span class="price-tag" id="price-${p.id}">${defaultPrice} ${curr}</span>
                  </div>
                  <div class="product-desc">${escapeHtml(p.description || '')}</div>
                  
                  <div class="product-card-actions">
                    <button class="btn-add-cart-card" onclick="window.addToCart('${p.id}')">${t.addToCartBtn}</button>
                    <button class="btn-share-card" onclick="window.shareProduct('${p.id}', event)"><i class="fa-solid fa-share-nodes"></i> ${t.shareBtn}</button>
                  </div>
                </div>
              </div>`;
          });
          finalHtml += `</div></div><div class="section-divider"></div>`;
        }
      }
      scrollArea.innerHTML = finalHtml || `<div style="text-align:center; padding:50px; color:#fff; font-weight:800;">${t.noMatch}</div>`;
    }

    window.updateCardPrice = (id) => {
      const sel = document.getElementById(`opt-${id}`);
      document.getElementById(`price-${id}`).innerText = sel.options[sel.selectedIndex].getAttribute("data-price") + " " + window.getCurrency();
    };

    window.addToCart = (pId) => {
      const p = allProducts.find(item => item.id === pId);
      if(!p) return;
      let optLabel = "وحدة", unitPrice = p.price;
      if(p.saleType === 'weight') {
        const sel = document.getElementById(`opt-${pId}`);
        optLabel = sel.options[sel.selectedIndex].text;
        unitPrice = Number(sel.options[sel.selectedIndex].getAttribute("data-price"));
      } else {
        optLabel = p.pricing?.unitLabel || "علبة";
        unitPrice = Number(p.pricing?.unitPrice || p.price);
      }
      const cartKey = pId + "_" + optLabel;
      const exist = cart.find(c => c.key === cartKey);
      if(exist) exist.qty++;
      else cart.push({ key: cartKey, id: pId, name: p.name, option: optLabel, price: unitPrice, qty: 1, note: '' });
      updateCartUI();
    };

    function updateCartUI() {
      const curr = window.getCurrency(), totalCount = cart.reduce((s, i) => s + i.qty, 0);
      const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      document.getElementById("cartCount").innerText = totalCount;
      document.getElementById("cartTotal").innerText = subtotal + " " + curr;
      document.getElementById("subtotalText").innerText = subtotal + " " + curr;
      document.getElementById("deliveryText").innerText = currentFee + " " + curr;
      document.getElementById("grandTotalText").innerText = (subtotal + currentFee) + " " + curr;

      const container = document.getElementById("cartItemsContainer");
      if(!cart.length) return container.innerHTML = `<p style='text-align:center; color:#94a3b8; padding:40px; font-weight:700;'>${dict[currentLang].emptyCart}</p>`;
      container.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div><strong>${escapeHtml(item.name)}</strong><br><small>${item.option} | ${item.price} ${curr}</small></div>
            <div style="display:flex; gap:8px; align-items:center;">
              <button class="qty-btn" onclick="window.changeQty(${idx}, -1)">-</button>
              <span>${item.qty}</span>
              <button class="qty-btn" onclick="window.changeQty(${idx}, 1)">+</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    window.changeQty = (idx, delta) => { cart[idx].qty += delta; if(cart[idx].qty <= 0) cart.splice(idx, 1); updateCartUI(); };
    window.openCartDrawer = () => { updateCartUI(); document.getElementById("cartModal").style.display = "flex"; };
    window.closeCartDrawer = () => document.getElementById("cartModal").style.display = "none";
    window.openCheckoutDrawer = () => { if(!cart.length) return alert(dict[currentLang].emptyCart); window.closeCartDrawer(); document.getElementById("checkoutModal").style.display = "flex"; };
    window.closeCheckoutDrawer = () => document.getElementById("checkoutModal").style.display = "none";

    function renderZonesSelect() {
      const curr = window.getCurrency();
      document.getElementById("custZone").innerHTML = `<option value="">اختر المنطقة...</option>` + deliveryZones.map(z => `<option value="${z.name}" data-fee="${z.fee}">${z.name} (${z.fee} ${curr})</option>`).join("");
    }

    function renderBranchesSelect(branches) {
      const sel = document.getElementById("pickupBranchSelect");
      if(sel) sel.innerHTML = branches.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join("");
    }

    window.toggleOrderType = () => {
      const isPickup = document.getElementById("orderTypeSelect").value === 'pickup';
      document.getElementById("deliveryFieldsGroup").style.display = isPickup ? 'none' : 'block';
      document.getElementById("branchSelectGroup").style.display = isPickup ? 'block' : 'none';
      currentFee = isPickup ? 0 : Number(document.getElementById("custZone").options[document.getElementById("custZone").selectedIndex]?.getAttribute("data-fee") || 0);
      updateCartUI();
    };

    window.updateDeliveryFee = () => {
      currentFee = Number(document.getElementById("custZone").options[document.getElementById("custZone").selectedIndex]?.getAttribute("data-fee") || 0);
      updateCartUI();
    };

    window.submitOrder = async () => {
      const curr = window.getCurrency(), name = document.getElementById("custName").value.trim(), phone = document.getElementById("custPhone").value.trim();
      const orderType = document.getElementById("orderTypeSelect").value;
      if(!name || !phone) return alert("يرجى إدخال الاسم ورقم الهاتف!");
      let zone = "", address = "", branch = "";
      if(orderType === 'delivery') {
        zone = document.getElementById("custZone").value; address = document.getElementById("custAddress").value.trim();
        if(!zone || !address) return alert("يرجى إكمال عنوان التوصيل!");
      } else { branch = document.getElementById("pickupBranchSelect").value; }

      const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      try {
        await addDoc(collection(db, "orders"), {
          customer: { name, phone, orderType, branch, zone, address },
          items: cart, subtotal, deliveryFee: currentFee, grandTotal: subtotal + currentFee, currency: curr, status: "new", createdAt: Date.now()
        });
        let msg = `طلب جديد - ${storeSettings.storeName || 'المتجر'}\n👤 العميل: ${name}\n📞 الهاتف: ${phone}\n`;
        cart.forEach(i => { msg += `▪️ ${i.name} (${i.option}) × ${i.qty} = ${i.price * i.qty} ${curr}\n`; });
        msg += `💵 الإجمالي: ${subtotal + currentFee} ${curr}`;
        window.location.href = `https://api.whatsapp.com/send?phone=${storeSettings.whatsappNumber || '201011406537'}&text=${encodeURIComponent(msg)}`;
      } catch(e) { alert("حدث خطأ، حاول مرة أخرى."); }
    };

    function escapeHtml(s) { return String(s||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  </script>
